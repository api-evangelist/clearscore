aid: clearscore
name: Clearscore
description: >-
  ClearScore is a London-founded fintech (2015) that gives consumers free access to their
  credit score and report and matches them to financial products — credit cards, loans, car
  finance, insurance and more — through a personalised financial marketplace. It also runs
  ClearScore Protect (dark-web identity monitoring), DriveScore (driving-behaviour scoring)
  and Open Banking features, and operates across the UK, South Africa, Australia, Canada and
  New Zealand. Its B2B arm, ClearScore Connect, exposes credit-data and eligibility services
  to partner lenders through a partner-gated developer portal (docs.clearscore.com). Backed by
  QED Investors. This profile was surfaced as a QED portfolio company and enriched by the API
  Evangelist pipeline; ClearScore's developer API is documented behind a password-gated
  ReadMe.io portal, so no public OpenAPI or machine-readable spec could be captured.
